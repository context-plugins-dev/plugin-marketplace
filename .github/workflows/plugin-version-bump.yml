name: Bump/sync plugin versions

# A commit touching a plugin is supposed to bump `version` in all three of its manifests
# (plugin.json, .claude-plugin/plugin.json, .cursor-plugin/plugin.json — see CLAUDE.md's "Per-IDE
# manifest convention"). This repairs it after the fact instead of blocking the push: it compares
# each changed plugin's highest declared version against what it declared before this push, accepts
# a genuine increase (syncing all three manifests to it), and otherwise bumps the previous version's
# patch by one — covering both "forgot to bump" and "bumped one file but not the other two".
#
# Scoped to plugins/** so it only fires on plugin content, not workflow/doc changes. Its own
# commits carry "[skip ci]", which GitHub Actions honors natively for push triggers, so this cannot
# retrigger itself even though (unlike the marketplace sync workflow) it does write under plugins/**.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch: {}

permissions:
  contents: write

# One run at a time — this job commits and pushes, same as the marketplace sync workflow.
concurrency:
  group: plugin-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base commit
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "TOUCHED_FILES_OUT=${RUNNER_TEMP}/plugin-version-touched.txt" >> "$GITHUB_ENV"
          echo "CHANGED_PLUGINS_OUT=${RUNNER_TEMP}/plugin-version-changed.txt" >> "$GITHUB_ENV"

      - name: Check plugin versions
        run: python3 .github/scripts/bump_plugin_versions.py

      - name: Commit and push
        env:
          MARKETPLACE_PUSH_TOKEN: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "apimatic-bot"
          git config user.email "developer@apimatic.io"

          # Re-derive on a rejected push rather than rebasing: the script's output is a pure
          # function of BASE_SHA + the current tree, so recomputing against the new origin/main is
          # simpler than replaying a version-bump commit through a rebase and is still idempotent.
          for attempt in 1 2 3 4 5; do
            if [ ! -s "$TOUCHED_FILES_OUT" ]; then
              echo "Already in sync."
              exit 0
            fi
            mapfile -t touched < "$TOUCHED_FILES_OUT"
            names="$(cat "$CHANGED_PLUGINS_OUT" 2>/dev/null || true)"
            names="${names:-plugin(s)}"

            if git diff --quiet -- "${touched[@]}"; then
              echo "Already in sync (no working-tree diff)."
              exit 0
            fi
            git add -- "${touched[@]}"
            git commit -m "Sync/bump plugin version for $names [skip ci]"
            if bash .github/scripts/push-main.sh; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — re-deriving against the latest main."
            git fetch origin main
            git reset --hard origin/main
            python3 .github/scripts/bump_plugin_versions.py
          done

          echo "Failed to push after 5 attempts." >&2
          exit 1
